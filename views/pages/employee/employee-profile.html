<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Employee Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
   <link rel="stylesheet" href="/style/style.css"></link>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container-fluid">

        <a class="navbar-brand" href="/employee">
            Employee Management System
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <!-- User Name -->
                <li class="nav-item">
                    <span class="nav-link" id="userDisplay"></span>
                </li>

                <!-- My Profile -->
                <li class="nav-item">
                    <a class="nav-link"
                       href="/employee/profile">
                        My Profile
                    </a>
                </li>

                <!-- My Department -->
                <li class="nav-item">
                    <a class="nav-link"
                       href="/employee/department">
                        My Department
                    </a>
                </li>

                <!-- Change Password -->
                <li class="nav-item">
                    <a class="nav-link"
                       href="/change-password">
                        Change Password
                    </a>
                </li>

                <!-- Logout -->
                <li class="nav-item ms-lg-2">
                    <button class="btn btn-light btn-sm"
                            onclick="logout()">
                        Logout
                    </button>
                </li>

            </ul>

        </div>
    </div>
</nav>


<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">My Profile</h2>
            <p class="text-muted mb-0">
                View and update your personal information
            </p>
        </div>
    </div>


    <div id="profileMessage" class="alert d-none"></div>


    <div class="card shadow-sm">

        <div class="card-body">

            <div class="row">

                <div class="col-md-4 text-center border-end">

                    <div class="mb-3">

                        <img
                            id="profilePhoto"
                            src=""
                            alt="Profile Photo"
                            class="rounded-circle img-thumbnail"
                            width="180"
                            height="180"
                        >

                        <div
                            id="noProfilePhoto"
                            class="rounded-circle bg-light border d-flex align-items-center justify-content-center mx-auto"
                            style="width:180px;height:180px;"
                        >
                            <span class="text-muted">
                                No Photo
                            </span>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label
                            for="profilePhotoInput"
                            class="form-label"
                        >
                            Change Profile Photo
                        </label>

                        <input
                            type="file"
                            id="profilePhotoInput"
                            class="form-control"
                            accept="image/jpeg,image/png,image/webp"
                        >
                    </div>

                </div>


                <div class="col-md-8">

                    <form id="employeeProfileForm">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Employee ID
                                </label>

                                <input
                                    type="text"
                                    id="employeeId"
                                    class="form-control"
                                    readonly
                                >
                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Status
                                </label>

                                <input
                                    type="text"
                                    id="employeeStatus"
                                    class="form-control"
                                    readonly
                                >
                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    id="employeeFirstName"
                                    class="form-control"
                                    readonly
                                >
                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    id="employeeLastName"
                                    class="form-control"
                                    readonly
                                >
                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="employeeEmail"
                                    class="form-control"
                                    readonly
                                >
                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Department
                                </label>

                                <input
                                    type="text"
                                    id="employeeDepartment"
                                    class="form-control"
                                    readonly
                                >
                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Designation
                                </label>

                                <input
                                    type="text"
                                    id="employeeDesignation"
                                    class="form-control"
                                    readonly
                                >
                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Date of Joining
                                </label>

                                <input
                                    type="text"
                                    id="employeeDateOfJoining"
                                    class="form-control"
                                    readonly
                                >
                            </div>


                            <div class="col-md-6 mb-3">
                                <label
                                    for="employeePhone"
                                    class="form-label"
                                >
                                    Phone
                                </label>

                                <input
                                    type="text"
                                    id="employeePhone"
                                    class="form-control"
                                >
                            </div>


                            <div class="col-md-6 mb-3">
                                <label
                                    for="employeeDateOfBirth"
                                    class="form-label"
                                >
                                    Date of Birth
                                </label>

                                <input
                                    type="date"
                                    id="employeeDateOfBirth"
                                    class="form-control"
                                >
                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    for="employeeGender"
                                    class="form-label"
                                >
                                    Gender
                                </label>

                                <select
                                    id="employeeGender"
                                    class="form-select"
                                >
                                    <option value="">
                                        Select Gender
                                    </option>

                                    <option value="Male">
                                        Male
                                    </option>

                                    <option value="Female">
                                        Female
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>
                                </select>

                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Salary
                                </label>

                                <input
                                    type="text"
                                    id="employeeSalary"
                                    class="form-control"
                                    readonly
                                >
                            </div>


                            <div class="col-12 mb-3">

                                <label
                                    for="employeeAddress"
                                    class="form-label"
                                >
                                    Address
                                </label>

                                <textarea
                                    id="employeeAddress"
                                    class="form-control"
                                    rows="3"
                                ></textarea>

                            </div>

                        </div>


                        <div class="text-end">

                            <button
                                type="submit"
                                id="updateProfileButton"
                                class="btn btn-primary"
                            >
                                Update Profile
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/shared/csrf.js"></script>
<script src="/js/pages/employee/employee-profile.js"></script>
<script src="/js/auth/logout.js"></script>


</body>
</html>

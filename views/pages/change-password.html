<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/style/style.css">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin">
            Employee Management System
        </a>

        <button
            class="btn btn-light btn-sm"
            id="logoutBtn"
        >
            Logout
        </button>
    </div>
</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card">

                <div class="card-body">

                    <h3 class="mb-4">
                        Change Password
                    </h3>

                    <div
                        id="message"
                        class="alert d-none"
                    ></div>


                    <form id="changePasswordForm">

                        <div class="mb-3">

                            <label
                                for="currentPassword"
                                class="form-label"
                            >
                                Current Password
                            </label>

                            <input
                                type="password"
                                id="currentPassword"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="newPassword"
                                class="form-label"
                            >
                                New Password
                            </label>

                            <input
                                type="password"
                                id="newPassword"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="confirmPassword"
                                class="form-label"
                            >
                                Confirm New Password
                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Change Password
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="/js/auth/logout.js"></script>
<script src="/js/auth/change-password.js"></script>
<script src="/js/shared/csrf.js"></script>
</body>
</html>

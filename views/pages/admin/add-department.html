<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Department - Admin </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">

            <a class="navbar-brand" href="/admin">
                Employee Management System
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <!-- User Name -->
                    <li class="nav-item">
                        <span class="nav-link" id="userDisplay"></span>
                    </li>


                    <!-- Add User -->
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/admin/add-user">
                            Manage User
                        </a>
                    </li>

                    <!-- Employees -->
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/admin/employees">
                           Manage Employees
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/admin/departments">
                            Manage Departments
                        </a>
                    </li>

                    <!-- Add Department -->
            

                    <!-- Change Password -->
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/change-password">
                            Change Password
                        </a>
                    </li>

                   
                    <li class="nav-item ms-lg-2">
                        <button class="btn btn-light btn-sm"
                                onclick="logout()">
                            Logout
                        </button>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Add Department</h3>
                    </div>
                    <div class="card-body p-4">
                        <form id="addDepartmentForm">
                            <div class="mb-3">
                                <label for="department_name" class="form-label">Department Name</label>
                                <input type="text" class="form-control" id="department_name" name="department_name" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                            </div>

                            <div class="mb-4">
                                <label for="status" class="form-label">Status</label>
                                <select class="form-select" id="status" name="status" required>
                                    <option value="">Select status</option>
                                    <option value="active">Active</option>
                                    <option value="inactive">Inactive</option>
                                </select>
                            </div>

                            <div id="formMessage" class="alert d-none" role="alert"></div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Create Department</button>
                                <a href="/admin" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth/logout.js"></script>
    <script src="/js/shared/csrf.js"></script>
    <script src="/js/pages/departments/department-form.js"></script>
</body>
</html>

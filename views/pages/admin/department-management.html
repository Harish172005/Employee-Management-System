<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Management - Admin</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="/style/style.css">
</head>
<body>
    
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">

            <a class="navbar-brand" href="/admin">
                Employee Management System
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <!-- User Name -->
                    <li class="nav-item">
                        <span class="nav-link" id="userDisplay"></span>
                    </li>


                    <!-- Add User -->
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/admin/add-user">
                            Manage User
                        </a>
                    </li>

                    <!-- Employees -->
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/admin/employees">
                           Manage Employees
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/admin/departments">
                            Manage Departments
                        </a>
                    </li>

                    <!-- Add Department -->
            

                    <!-- Change Password -->
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/change-password">
                            Change Password
                        </a>
                    </li>

                   
                    <li class="nav-item ms-lg-2">
                        <button class="btn btn-light btn-sm"
                                onclick="logout()">
                            Logout
                        </button>
                    </li>

                </ul>

            </div>
        </div>
    </nav>
     <div class="container-fluid py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="mb-1 fw-semibold">
                Departments
            </h2>

            <p class="text-muted mb-0">
                Manage and organize your company departments
            </p>
        </div>

       <a href="/admin/add-department" class="btn btn-primary btn-sm">Add Department</a>

    </div>


    <!-- Search & Filter -->
    <div class="row g-3 mb-4">

        <div class="col-md-8">

            <div class="input-group">

                <span class="input-group-text bg-white">
                    <i class="bi bi-search"></i>
                </span>

                <input
                    type="text"
                    id="departmentSearch"
                    class="form-control"
                    placeholder="Search departments..."
                >

            </div>

        </div>


        <div class="col-md-4">

            <select
                id="departmentStatusFilter"
                class="form-select"
            >
                <option value="">
                    All Status
                </option>

                <option value="active">
                    Active
                </option>

                <option value="inactive">
                    Inactive
                </option>
            </select>

        </div>

    </div>


    <!-- Department Cards -->
    <div
        id="departmentContainer"
        class="row g-4"
    >

    </div>

</div>

<!-- Edit Department Modal -->
<div
    class="modal fade"
    id="editDepartmentModal"
    tabindex="-1"
    aria-labelledby="editDepartmentModalLabel"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5
                    class="modal-title"
                    id="editDepartmentModalLabel"
                >
                    Edit Department
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>

            <form id="editDepartmentForm">

                <div class="modal-body">

                    <div
                        id="editFormMessage"
                        class="alert d-none"
                        role="alert"
                    ></div>

                    <div class="mb-3">
                        <label
                            for="edit_department_name"
                            class="form-label"
                        >
                            Department Name
                        </label>

                        <input
                            type="text"
                            id="edit_department_name"
                            name="department_name"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label
                            for="edit_description"
                            class="form-label"
                        >
                            Description
                        </label>

                        <textarea
                            id="edit_description"
                            name="description"
                            class="form-control"
                            rows="3"
                        ></textarea>
                    </div>

                    <div class="mb-3">
                        <label
                            for="edit_status"
                            class="form-label"
                        >
                            Status
                        </label>

                        <select
                            id="edit_status"
                            name="status"
                            class="form-select"
                            required
                        >
                            <option value="active">
                                Active
                            </option>

                            <option value="inactive">
                                Inactive
                            </option>
                        </select>
                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Update Department
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/js/pages/departments/view-departments.js"></script>

    <script src="/js/pages/departments/edit-department.js"></script>

    <script src="/js/pages/departments/deactivate-department.js"></script>

    <script src="/js/shared/csrf.js"></script>

    <script src="/js/auth/logout.js"></script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Employee Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/style/style.css">
</head>

<body>

    <!-- Single Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="/admin">
                Employee Management System
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <!-- User Name -->
                    <li class="nav-item">
                        <span class="nav-link" id="userDisplay"></span>
                    </li>


                    <!-- Add User -->
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/admin/add-user">
                            Manage User
                        </a>
                    </li>

                    <!-- Employees -->
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/admin/employees">
                           Manage Employees
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/admin/departments">
                            Manage Departments
                        </a>
                    </li>

                    <!-- Add Department -->
            

                    <!-- Change Password -->
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/change-password">
                            Change Password
                        </a>
                    </li>

                   
                    <li class="nav-item ms-lg-2">
                        <button class="btn btn-light btn-sm"
                                onclick="logout()">
                            Logout
                        </button>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container py-5">

        <div class="mb-5">

            <h1 class="mb-1">Admin Dashboard</h1>
            <p class="text-muted mb-0">
                Employee and department overview
            </p>
        </div>

        <section class="mb-5">
            <h2 class="h4 mb-3">Overview</h2>

            <div id="dashboardSummary" class="row g-4">
                <div class="col-12 text-center text-muted">
                    Loading dashboard...
                </div>
            </div>
        </section>

        <section>
            <h2 class="h4 mb-3">Employees by Department</h2>

            <div id="departmentEmployeeCounts" class="row g-4">
                <div class="col-12 text-center text-muted">
                    Loading departments...
                </div>
            </div>
        </section>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="/js/shared/csrf.js"></script>
    <script src="/js/auth/logout.js"></script>
    <script src="/js/pages/dashboard/dashboard.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Employee Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/style/style.css">
</head>

<body>

    <!-- Single Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="/admin">
                Admin Dashboard
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <!-- User Name -->
                    <li class="nav-item">
                        <span class="nav-link" id="userDisplay"></span>
                    </li>

                    <!-- Add Employee -->
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/admin/add-employee">
                            Add Employee
                        </a>
                    </li>

                    <!-- Add User -->
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/admin/add-user">
                            Add User
                        </a>
                    </li>

                    <!-- Change Password -->
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/change-password">
                            Change Password
                        </a>
                    </li>

                   
                    <li class="nav-item ms-lg-2">
                        <button class="btn btn-light btn-sm"
                                onclick="logout()">
                            Logout
                        </button>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container py-5">

        <div class="text-center">

            <h1>Welcome to Admin Dashboard</h1>

            <p class="text-muted">
                Manage employees and your account from the navigation bar.
            </p>

            <div class="mt-4 d-flex justify-content-center gap-3 flex-wrap">
                <a href="/admin/add-employee" class="btn btn-primary">Add Employee</a>
                <a href="/admin/add-user" class="btn btn-outline-primary">Add User</a>
                <a href="/change-password" class="btn btn-outline-secondary">Change Password</a>
            </div>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="/script/logout.js"></script>

</body>

</html>
